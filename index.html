<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя 💐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #ffe0ec 0%, #ffd1e8 50%, #e0c3fc 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }

  .container {
    text-align: center;
    padding: 20px;
    max-width: 500px;
    width: 100%;
  }

  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    padding: 35px 25px;
    box-shadow: 0 20px 60px rgba(255,105,180,0.3);
    border: 2px solid rgba(255,255,255,0.9);
  }

  h1 {
    font-size: 1.8rem;
    color: #d6336c;
    margin-bottom: 10px;
  }

  .subtitle {
    color: #a8648a;
    font-size: 0.95rem;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  #gameArea {
    position: relative;
    width: 100%;
    height: 320px;
    background: linear-gradient(180deg, #fff5fa 0%, #ffe8f3 100%);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 18px;
    border: 2px dashed #ffb3d1;
    cursor: pointer;
    touch-action: none;
  }

  .flower {
    position: absolute;
    font-size: 38px;
    line-height: 1;
    animation: float 0.5s ease-out;
    pointer-events: none;
    filter: drop-shadow(0 3px 5px rgba(255,105,180,0.4));
  }

  @keyframes float {
    0% { transform: scale(0) rotate(-30deg); }
    70% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .score-box {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-bottom: 16px;
    font-size: 1rem;
    color: #a8648a;
    font-weight: 600;
  }

  .score-box span { color: #d6336c; }

  .progress-bar {
    width: 100%;
    height: 14px;
    background: #ffe0ec;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 18px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff8fab, #ff5c8a, #d6336c);
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  button {
    background: linear-gradient(135deg, #ff8fab, #d6336c);
    color: white;
    border: none;
    padding: 14px 40px;
    font-size: 1.1rem;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(214,51,108,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(214,51,108,0.5);
  }

  button:active { transform: translateY(0); }

  .hidden { display: none; }

  .final-message {
    color: #d6336c;
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 15px 0;
  }

  .hearts {
    font-size: 2rem;
    margin: 10px 0;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .bouquet {
    font-size: 3rem;
    margin: 10px 0;
    letter-spacing: 5px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">

    <!-- Экран приветствия -->
    <div id="startScreen">
      <h1>Привет, солнышко 🌸</h1>
      <p class="subtitle">
        Это маленькая игра специально для тебя.<br>
        Собери букет из 12 цветов — и получишь сюрприз 💌
      </p>
      <div class="hearts">💖💐💖</div>
      <button onclick="startGame()">Начать ✨</button>
    </div>

    <!-- Игровой экран -->
    <div id="gameScreen" class="hidden">
      <div class="score-box">
        <div>Собрано: <span id="score">0</span>/12</div>
        <div>Промахи: <span id="misses">0</span></div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div id="gameArea"></div>
      <p style="font-size:0.8rem;color:#b088a0;">Нажимай на цветочки 🌷</p>
    </div>

    <!-- Финальный экран -->
    <div id="endScreen" class="hidden">
      <div class="bouquet">💐</div>
      <h1>Букет собран!</h1>
      <p class="final-message" id="finalMsg"></p>
      <div class="hearts">💕</div>
      <button onclick="restart()">Ещё раз 🎈</button>
    </div>

  </div>
</div>

<script>
const flowers = ['🌸','🌺','🌷','🌹','🌻','💐','🌼','💮','🏵️'];
const target = 12;
let score = 0;
let misses = 0;
let gameActive = false;
let spawnTimer = null;
let missTimer = null;

const startScreen = document.getElementById('startScreen');
const gameScreen  = document.getElementById('gameScreen');
const endScreen   = document.getElementById('endScreen');
const gameArea    = document.getElementById('gameArea');
const scoreEl     = document.getElementById('score');
const missesEl    = document.getElementById('misses');
const progressEl  = document.getElementById('progress');

function startGame() {
  startScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  endScreen.classList.add('hidden');

  score = 0;
  misses = 0;
  gameActive = true;
  scoreEl.textContent = 0;
  missesEl.textContent = 0;
  progressEl.style.width = '0%';
  gameArea.innerHTML = '';

  spawnFlower();
  spawnTimer = setInterval(spawnFlower, 750);
  missTimer  = setInterval(() => {
    if (gameActive) {
      misses++;
      missesEl.textContent = misses;
    }
  }, 2500);
}

function spawnFlower() {
  if (!gameActive) return;

  const flower = document.createElement('div');
  flower.className = 'flower';
  flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];

  const maxX = gameArea.clientWidth - 50;
  const maxY = gameArea.clientHeight - 50;
  flower.style.left = Math.random() * maxX + 'px';
  flower.style.top  = Math.random() * maxY + 'px';

  // бонусные сердечки иногда
  if (Math.random() < 0.12) {
    flower.textContent = '💖';
    flower.dataset.bonus = 'true';
  }

  flower.addEventListener('pointerdown', catchFlower);
  gameArea.appendChild(flower);

  // авто-исчезновение
  setTimeout(() => {
    if (flower.parentNode) flower.remove();
  }, 2200);
}

function catchFlower(e) {
  e.stopPropagation();
  if (!gameActive) return;

  const flower = e.currentTarget;
  const bonus = flower.dataset.bonus === 'true';

  score += bonus ? 2 : 1;
  if (score > target) score = target;

  scoreEl.textContent = score;
  progressEl.style.width = (score / target * 100) + '%';

  // эффект исчезновения
  flower.style.transition = 'transform 0.25s, opacity 0.25s';
  flower.style.transform = 'scale(1.8) rotate(20deg)';
  flower.style.opacity = '0';
  setTimeout(() => flower.remove(), 250);

  if (score >= target) endGame();
}

function endGame() {
  gameActive = false;
  clearInterval(spawnTimer);
  clearInterval(missTimer);

  setTimeout(() => {
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');

    const msg = document.getElementById('finalMsg');

    if (misses === 0) {
      msg.innerHTML = 'Идеально! Ни одного промаха 🎯<br><br>' +
        'Ты — само совершенство. Как и этот букет, ты делаешь мир ярче. ' +
        'Пусть каждый твой день будет таким же красивым, как эти цветы 🌷<br><br>' +
        'Ты самая лучшая. Помни это всегда 💖';
    } else if (misses <= 4) {
      msg.innerHTML = 'Отличный результат! ✨<br><br>' +
        'Ты собрала целый букет счастья. Пусть твоя улыбка сияет так же ярко, ' +
        'как эти цветочки. Ты заслуживаешь всего самого доброго 🌸<br><br>' +
        'Улыбнись — ты прекрасна 💕';
    } else {
      msg.innerHTML = 'Букет собран! 💐<br><br>' +
        'Даже если что-то не получалось с первого раза — главное, что ты не сдалась. ' +
        'Так и в жизни: всё обязательно получится 🌼<br><br>' +
        'Ты молодец. И ты очень дорога 💗';
    }
  }, 400);
}

function restart() {
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
}

// адаптив: пересчёт позиций при ресайзе
window.addEventListener('resize', () => {
  // ничего критичного — новые цветы встанут корректно
});
</script>

</body>
</html>
